# NeoMedia Android release — GitHub Actions (ubuntu)
# Tag push (v*) builds split APKs and publishes them as a GitHub Release.
name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64

      - name: Rename APKs
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk NeoReader-arm64-release.apk
          cp app-armeabi-v7a-release.apk NeoReader-armeabi-v7a-release.apk
          ls -lh NeoReader-*.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoReader-android-release
          path: build/app/outputs/flutter-apk/NeoReader-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NeoReader ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/NeoReader-arm64-release.apk
            build/app/outputs/flutter-apk/NeoReader-armeabi-v7a-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
